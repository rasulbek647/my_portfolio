{# Panel tilini tanlash — ixcham segment ko'rinishida #}
<div class="d-lang" role="group" aria-label="{{ dash.ui_language }}">
  <form method="post" action="{% url 'dashboard:set_ui_lang' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    <button type="submit" name="lang" value="uz" class="{% if admin_ui_lang == 'uz' %}is-active{% endif %}" {% if admin_ui_lang == 'uz' %}aria-current="true"{% endif %}>UZ</button>
    <button type="submit" name="lang" value="en" class="{% if admin_ui_lang == 'en' %}is-active{% endif %}" {% if admin_ui_lang == 'en' %}aria-current="true"{% endif %}>EN</button>
    <button type="submit" name="lang" value="ru" class="{% if admin_ui_lang == 'ru' %}is-active{% endif %}" {% if admin_ui_lang == 'ru' %}aria-current="true"{% endif %}>RU</button>
  </form>
</div>
