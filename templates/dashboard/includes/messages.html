{% if messages %}
<div style="display:grid;gap:.6rem;margin-bottom:1.4rem">
  {% for message in messages %}
  <div role="alert" class="d-alert {% if message.tags == 'success' %}d-alert--success{% elif message.tags == 'error' %}d-alert--error{% else %}d-alert--info{% endif %}">
    {% if message.tags == 'success' %}
    <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>
    {% elif message.tags == 'error' %}
    <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></svg>
    {% else %}
    <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    {% endif %}
    <p>{{ message }}</p>
  </div>
  {% endfor %}
</div>
{% endif %}
